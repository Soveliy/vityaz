<div
  class="modal"
  data-modal="request"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
  aria-labelledby="request-modal-title"
  hidden
>
  <div class="modal__dialog" data-modal-dialog>
    <button class="modal__close" type="button" data-modal-close aria-label="Закрыть окно"></button>
    <h2 class="modal__title" id="request-modal-title">Оставьте заявку — мы вам перезвоним</h2>

    <form class="modal__form form" action="#" data-request-form>
      <input type="hidden" name="request_type" data-request-type value="Заявка с сайта" />
      <div class="form__item">
        <label class="form__label" for="modal-name">Имя</label>
        <input
          class="form__input"
          id="modal-name"
          type="text"
          name="name"
          placeholder="Ваше имя"
          autocomplete="name"
          required
        />
      </div>
      <div class="form__item">
        <label class="form__label" for="modal-phone">Телефон</label>
        <input
          class="form__input"
          id="modal-phone"
          type="tel"
          name="phone"
          placeholder="Ваш номер телефона"
          autocomplete="tel"
          required
        />
      </div>
      <div class="form__footer">
        <button class="btn form__btn" type="submit">Отправить</button>
        <label class="form__checkbox">
          <input type="checkbox" required />
          <span
            >Я согласен(а) на <a href="#" target="_blank">обработку персональных данных</a></span
          >
        </label>
      </div>
    </form>
  </div>
</div>

<div class="notice" data-success-notice role="status" aria-live="polite" hidden>
  <strong class="notice__title">Успешно</strong>
  <span class="notice__text">Ваша заявка принята в работу</span>
</div>
