<aside
  class="cookie-notice"
  data-cookie-notice
  role="region"
  aria-labelledby="cookie-notice-title"
  hidden
>
  <button
    class="cookie-notice__close"
    type="button"
    data-cookie-accept
    aria-label="Закрыть уведомление о cookie"
    title="Понятно"
  ></button>
  <strong class="cookie-notice__title" id="cookie-notice-title">
    Мы используем файлы cookie
  </strong>
  <p class="cookie-notice__text">
    Это нужно, чтобы сайт работал корректно и помогал нам улучшать качество сервиса. Продолжая
    пользоваться сайтом, вы соглашаетесь с использованием файлов cookie.
  </p>
</aside>
